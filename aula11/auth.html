<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a href="index.html" class="py-2 px-3 bg-primary text-white rounded-md hover:shadow-inner ml-auto mr-4 shadow">Voltar</a>
    <div class="h-full flex">
        <div class="max-w-sm mx-auto my-auto p-5 bg-feature rounded-lg shadow-md flex column">
            <h2 class="text-primary">Login</h2>
            
            <form class="flex column">
                <article>
                    Email: <input id="lEmail" type="email" placeholder="Digite o seu email" />
                </article>
                <article class="mt-2 mb-2">
                    Senha: <input id="lPassword" type="password" placeholder="Digite sua senha" />
                </article>
                <a id="btLogin" class="mt-5 bg-primary text-white text-center rounded-md py-2">Entrar</a>
            </form>
        </div>
    </div>
</body>

<pre id="pResponse"></pre>

<script src="user.js"></script>

</html>
