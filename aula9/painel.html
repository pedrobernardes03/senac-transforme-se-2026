<html>
    <head>
        <title>Cadasro de Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    </head>
        <body class="bg-about">
<h3 id="welcome"></h3>
<h2>Cadastro de Usuário</h2>
<p>Preencha as informações abaixo</p>
<form id="formRegister">
    Nome: <input id="iName" type="text" placeholder="Digite seu nome completo" /><br>
    Email: <input id="iEmail" type="email" placeholder="Digite o seu melhor email" /><br>
    Senha: <input id="iPassword" type="password" placeholder="Letra maiuscula e números" /><br>
    Data de nascimento: <input id="iDate" type="date" /><br>
    <button type="submit">Salvar</button>
</form>

<pre id="logUsers"></pre>

</body>

<script src="user.js"></script>

</html>
